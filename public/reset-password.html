<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restablecer contraseña — Alex API</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav class="navbar">
  <div class="navbar-inner">
    <a href="/index.html" class="brand"><span class="brand-mark">A</span> Alex API</a>
    <div class="nav-links"></div>
    <div class="nav-actions">
      <a href="/login.html" class="btn btn-secondary btn-sm">Iniciar sesión</a>
    </div>
  </div>
</nav>

<div class="auth-shell">
  <div class="auth-card fade-up">
    <div class="auth-logo"><span class="brand-mark" style="width:44px;height:44px;font-size:18px">A</span></div>
    <div class="card card-lg">
      <h2 style="text-align:center">Elige una nueva contraseña</h2>

      <form id="reset-form" novalidate>
        <div class="field">
          <label for="password">Nueva contraseña</label>
          <input type="password" id="password" name="password" autocomplete="new-password" required minlength="8">
          <div class="field-hint">Mínimo 8 caracteres, con letras y números.</div>
        </div>
        <div class="field">
          <label for="password2">Confirma la contraseña</label>
          <input type="password" id="password2" name="password2" autocomplete="new-password" required minlength="8">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Restablecer contraseña</button>
      </form>
    </div>
  </div>
</div>

<footer class="footer">
  <div class="container footer-inner">
    <span class="footer-copy">Creado por Luis © 2026</span>
  </div>
</footer>

<script src="/js/app.js"></script>
<script>
const params = new URLSearchParams(location.search);
const token = params.get('token');

document.getElementById('reset-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  const password = document.getElementById('password').value;
  const password2 = document.getElementById('password2').value;

  if (!token) { toast('Enlace inválido: falta el token.', 'error'); return; }
  if (password !== password2) { toast('Las contraseñas no coinciden.', 'error'); return; }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Guardando…';

  try {
    const data = await AlexAPI.request('/auth/reset-password', { method: 'POST', body: { token, password }, auth: false });
    toast(data.message);
    setTimeout(() => { location.href = '/login.html'; }, 1200);
  } catch (err) {
    toast(err.message, 'error');
    btn.disabled = false;
    btn.textContent = 'Restablecer contraseña';
  }
});
</script>
</body>
</html>
