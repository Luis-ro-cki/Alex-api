<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión — Alex API</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav class="navbar">
  <div class="navbar-inner">
    <a href="/index.html" class="brand"><span class="brand-mark">A</span> Alex API</a>
    <div class="nav-links">
      <a href="/index.html#categorias">Endpoints</a>
      <a href="/docs.html">Documentación</a>
      <a href="/pricing.html">Precios</a>
    </div>
    <div class="nav-actions">
      <a href="/register.html" class="btn btn-secondary btn-sm">Crear cuenta</a>
      <button class="nav-toggle" aria-label="Abrir menú"><i data-lucide="menu"></i></button>
    </div>
  </div>
</nav>

<div class="auth-shell">
  <div class="auth-card fade-up">
    <div class="auth-logo"><span class="brand-mark" style="width:44px;height:44px;font-size:18px">A</span></div>
    <div class="card card-lg">
      <h2 style="text-align:center">Inicia sesión</h2>
      <p style="text-align:center;font-size:14px">Accede a tu dashboard y tus API Keys.</p>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
          <div class="field-hint" style="text-align:right"><a href="/forgot-password.html" style="color:var(--accent-cyan)">¿Olvidaste tu contraseña?</a></div>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Iniciar sesión</button>
      </form>

      <p style="text-align:center;font-size:14px;margin-top:20px">¿No tienes cuenta? <a href="/register.html" style="color:var(--accent-cyan)">Regístrate gratis</a></p>
    </div>
  </div>
</div>

<footer class="footer">
  <div class="container footer-inner">
    <span class="footer-copy">Creado por Luis © 2026</span>
  </div>
</footer>

<script src="/js/app.js"></script>
<script>
redirectIfLoggedIn();

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Ingresando…';

  try {
    const data = await AlexAPI.request('/auth/login', { method: 'POST', body: { email, password }, auth: false });
    AlexAPI.setToken(data.token);
    AlexAPI.setUser(data.user);
    toast('Bienvenido de nuevo');
    location.href = '/dashboard.html';
  } catch (err) {
    toast(err.message, 'error');
    btn.disabled = false;
    btn.textContent = 'Iniciar sesión';
  }
});
</script>
</body>
</html>
